# Load profiles of the load generator (GEN-3), run by name:
#   bench load -profile small-heavy ...
#
# Every profile is open-loop: calls follow a schedule drawn from the seed of
# the run and do not wait for answers. Fields:
#   small      unary calls arriving as a Poisson process: rate per second;
#              request and response each of a size drawn uniformly from
#              min_size to max_size bytes
#   heavy      a unary call every period with a response of size bytes
#   echo       messages of size bytes on one bidi stream, a Poisson process
#              of rate per second; the server sends each back
#   reconnect  a new connection every period, and right after it calls small
#              calls on it, of the sizes of small
#
# The values are the defaults of repo-requirements.md; the pilot (phase 2)
# kept them, see docs/pilot.md.
loads:
  - name: small
    description: Мелкие unary
    small: {rate: 200, min_size: 100, max_size: 1000}

  - name: small-heavy
    description: Мелкие рядом с тяжёлым вызовом
    small: {rate: 200, min_size: 100, max_size: 1000}
    heavy: {size: 1048576, every: 1s}

  - name: bidi
    description: bidi-стрим
    echo: {rate: 20, size: 200}

  - name: reconnect
    description: Переподключение
    small: {min_size: 100, max_size: 1000}
    reconnect: {every: 5s, calls: 10}

  - name: heavy-8m
    description: Ответ 8 МиБ; требует явного увеличения лимита сообщений
    heavy: {size: 8388608, every: 1s}

  - name: bulk
    description: Один server-stream 100 МиБ блоками по 64 КиБ
    bulk: {total_bytes: 104857600, chunk_bytes: 65536, timeout: 60s}

  # Narrow links: keep the expected useful load below 50% in each direction.
  - name: small-heavy-1mbit
    description: Мелкие и ответ 64 КиБ на канале 1 Мбит/с
    small: {rate: 50, min_size: 100, max_size: 1000}
    heavy: {size: 65536, every: 2s}

  - name: small-heavy-10mbit
    description: Мелкие и ответ 1 МиБ на канале 10 Мбит/с
    small: {rate: 200, min_size: 100, max_size: 1000}
    heavy: {size: 1048576, every: 2200ms}

  # EXP-9: vary either the small call rate or the heavy response size.
  - name: small-50
    description: Мелкие unary, 50 вызовов/с
    small: {rate: 50, min_size: 100, max_size: 1000}

  - name: small-1000
    description: Мелкие unary, 1000 вызовов/с
    small: {rate: 1000, min_size: 100, max_size: 1000}

  - name: small-heavy-64k
    description: Мелкие и ответ 64 КиБ раз в 2 с
    small: {rate: 200, min_size: 100, max_size: 1000}
    heavy: {size: 65536, every: 2s}

  - name: small-heavy-1m
    description: Мелкие и ответ 1 МиБ раз в 2 с
    small: {rate: 200, min_size: 100, max_size: 1000}
    heavy: {size: 1048576, every: 2s}

  - name: small-heavy-8m
    description: Мелкие и ответ 8 МиБ раз в 2 с
    small: {rate: 200, min_size: 100, max_size: 1000}
    heavy: {size: 8388608, every: 2s}
