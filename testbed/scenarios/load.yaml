# Load profiles of the load generator (GEN-3), run by name:
#   bench load -profile small-heavy ...
#
# Every profile is open-loop: calls follow a schedule drawn from the seed of
# the run and do not wait for answers. Fields:
#   small      unary calls arriving as a Poisson process: rate per second;
#              request and response each of a size drawn uniformly from
#              min_size to max_size bytes
#   heavy      a unary call every period with a response of size bytes
#   echo       messages of size bytes on one bidi stream, a Poisson process
#              of rate per second; the server sends each back
#   reconnect  a new connection every period, and right after it calls small
#              calls on it, of the sizes of small
#
# The values are the defaults of repo-requirements.md and will be refined
# after the pilot (phase 2).
loads:
  - name: small
    description: Мелкие unary
    small: {rate: 200, min_size: 100, max_size: 1000}

  - name: small-heavy
    description: Мелкие рядом с тяжёлым вызовом
    small: {rate: 200, min_size: 100, max_size: 1000}
    heavy: {size: 1048576, every: 1s}

  - name: bidi
    description: bidi-стрим
    echo: {rate: 20, size: 200}

  - name: reconnect
    description: Переподключение
    small: {min_size: 100, max_size: 1000}
    reconnect: {every: 5s, calls: 10}
