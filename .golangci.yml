version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - gocritic
    - gosec
    - misspell
    - revive
    - unconvert
    - unparam
  exclusions:
    rules:
      # gosec targets production code; tests and test helpers are exempt.
      - path: (_test\.go|/internal/transporttest/)
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/VladimirKhmelev/quic-rpc-go
